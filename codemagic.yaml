# Codemagic CI: builds the iOS app on a cloud Mac and uploads it to
# TestFlight. Started MANUALLY from codemagic.io (Start new build). Same
# pipeline as PokemonStrategyApp; the full walkthrough lives in
# JonWesOBVault/"how to make android app available for iPhone.md".
#
# Wired up once in the Codemagic UI (shared with the Pokemon app):
# - this GitHub repo added to the Codemagic GitHub App + as a Codemagic app
# - Developer Portal integration key named exactly "AppStoreConnect"
# - the SAME Apple Distribution certificate (one cert covers every app on
#   the account); only this app's App Store provisioning profile is new
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: AppStoreConnect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jonwes.golfTrackerApp
      flutter: stable
    scripts:
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa
        script: |
          # CFBundleVersion must be unique per TestFlight upload;
          # PROJECT_BUILD_NUMBER is Codemagic's per-app counter.
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
